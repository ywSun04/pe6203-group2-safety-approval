<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="692" viewBox="0 0 1120 692" role="img" aria-labelledby="title desc"><title id="title">Smoke run API token components</title><desc id="desc">Historical smoke-run token subtotals, split by agent, policy and reviewer. Unknown usage is labelled and shown with lower opacity.</desc><rect width="1120" height="692" fill="white"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="23" fill="#17212c" font-weight="bold">Recorded API tokens in historical smoke runs</text><text x="32" y="62" font-family="Arial, sans-serif" font-size="13" fill="#17212c" >One row per task run. These are connection checks, not a formal policy comparison.</text><text x="32" y="83" font-family="Arial, sans-serif" font-size="13" fill="#17212c" >Task totals count retries once; only late usage excluded from task totals is added. Unknown usage is marked.</text><rect x="32" y="101" width="14" height="14" fill="#2563a6"/><text x="54" y="113" font-family="Arial, sans-serif" font-size="12" fill="#17212c" >Agent 48,710</text><rect x="232" y="101" width="14" height="14" fill="#18866d"/><text x="254" y="113" font-family="Arial, sans-serif" font-size="12" fill="#17212c" >Policy 0</text><rect x="432" y="101" width="14" height="14" fill="#b45309"/><text x="454" y="113" font-family="Arial, sans-serif" font-size="12" fill="#17212c" >Reviewer 6,496</text><text x="32" y="155" font-family="Arial, sans-serif" font-size="14" fill="#17212c" font-weight="bold">full_approve   k=0</text><text x="32" y="175" font-family="Arial, sans-serif" font-size="11" fill="#596274" >20261027T140219Z-c17a974... | user_task_0</text><text x="32" y="192" font-family="Arial, sans-serif" font-size="10" fill="#596274" >Settings d664d833026c81a1</text><rect x="440" y="143" width="278.7256584346788" height="24" fill="#2563a6" opacity="1"><title>agent: 6671; usage complete: true</title></rect><text x="727.7256584346787" y="160" font-family="Arial, sans-serif" font-size="12" fil